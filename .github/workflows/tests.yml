name: Android tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Verificar arquivos versionados
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          test -z "$tracked" || { printf '%s\n' "$tracked"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/summary.py --self-test
      - run: cp .env.example .env
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run prepare:app
      - name: Compilar app React Native e instrumentação
        run: |
          chmod +x .app/android/gradlew
          npm run build:android
      - name: Liberar arquivos de compilação antes do emulador
        run: |
          df -h .
          rm -rf .app/android/app/build/intermediates .app/android/app/.cxx "$HOME/.gradle/caches" "$ANDROID_HOME/ndk/27.1.12297006"
          test -s .app/android/app/build/outputs/apk/release/app-release.apk
          test -s .app/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          df -h .
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: tests
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: npm run test:android
      - name: Resumo dos testes
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EXPECTED_TESTS: '5'
          JUNIT_PATTERN: 'results/**/junit*.xml'
          TEST_SCOPE: Android 35 / exemplo oficial Wix React Native / Detox. Estado em memória; sem backend ou validação iOS.
        run: python scripts/summary.py
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: android-results
          path: results/
          retention-days: 14
          if-no-files-found: error
      - name: Link dos resultados
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Baixar resultados](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
